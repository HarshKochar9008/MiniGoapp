name: minigo
description: Real-time mobile file sharing app (Android/iOS only).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.3.4

  # File picking & handling
  file_picker: ^13.3.2
  mime: ^2.0.0
  path_provider: ^2.1.3

  # Save to gallery (Android MediaStore + iOS Photos)
  gal: ^2.3.0

  # Permissions
  permission_handler: ^13.0.2

  # Local storage for identity persistence
  shared_preferences: ^2.2.3

  # SHA-256 checksum for file integrity
  crypto: ^3.0.3

  # End-to-end encryption: X25519 key agreement + AES-256-GCM file cipher
  cryptography: ^2.7.0

  # Hardware-backed secure storage for the device's private key
  # (Android Keystore / iOS Keychain)
  # Hold at 10.x until installs from the 9.x builds have updated: 10 moves
  # their keys out of EncryptedSharedPreferences, which 11 can no longer read.
  flutter_secure_storage: ^10.3.1

  # Network connectivity detection
  connectivity_plus: ^7.3.1

  # Free disk space checks
  disk_space_plus: ^0.2.6
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  flutter_dotenv: ^6.0.1

  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  tus_client_dart: ^2.5.0
  cross_file: ^0.3.4
  battery_plus: ^7.0.0
  google_fonts: ^9.0.0
  lucide_icons_flutter: ^4.0.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

  # Frosted-glass surfaces (GlossyContainer) — wrapped as MiniGlass
  glossy: ^0.0.5
  share_plus: ^13.3.1

  # Onboarding lever sound (played as a UI sound: obeys silent mode)
  audioplayers: ^6.8.1

  # Runtime self-protection: tampering, hooking, root/jailbreak and install
  # source checks (lib/core/security/)
  freerasp: ^8.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Launcher icons are generated from the square plates in assets/icon/ — the
# saucer artwork centred upright. Note when resizing the foreground: the
# generated ic_launcher.xml wraps it in <inset android:inset="16%">, so the
# drawable lands at 73.44 of the 108dp layer while the launcher masks the middle
# 72dp. The visible viewport is therefore ~98% of the plate, not the 66.67%
# safe zone the adaptive-icon docs describe; the saucer spans 78% of it.
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/minigo_ufo.png
    - assets/icon/app_icon.png
    - assets/sounds/
    # The Outfit / JetBrains Mono weights the app uses, so google_fonts never
    # downloads them (see tool/fetch_fonts.py).
    - assets/google_fonts/
    - .env
