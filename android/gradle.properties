org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Parallel module compile + reuse outputs from prior builds. Big speed win on
# multi-module Flutter projects with Firebase + ML Kit pulling lots of deps.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
android.useAndroidX=true
# Left disabled — was intentionally turned off pre-existing. Re-enable later
# to halve rebuild times once we identify which plugin was breaking it.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
